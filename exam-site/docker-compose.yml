# ── 后端 ─────────────────────────────────────────────────────
# 启动: docker compose up -d backend
# 停止: docker compose down

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-step-3.7-flash}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.stepfun.com/step_plan/v1}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-30}
    volumes:
      - ./doc:/doc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
